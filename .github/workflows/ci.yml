name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  qualite:
    name: Lint, format et types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer les dependances
        # Tous les groupes sont installes ici, et pour une seule raison : ce que
        # le verificateur de types ne peut pas importer, il ne verifie pas. Un
        # groupe oublie ferait passer le module correspondant a travers le
        # controle sans que rien ne le signale. Le cache uv evite de
        # retelecharger la pile a chaque execution.
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer les dependances
        # Les modeles spaCy sont epingles dans pyproject.toml : le cache uv
        # evite de les retelecharger a chaque execution. `api` reste leger : il
        # permet de tester le service sans installer torch ni vLLM.
        run: uv sync --group dev --group api

      - name: Tests
        run: uv run pytest -q -m "not integrite"

  donnees:
    name: Integrite du jeu de donnees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer les dependances
        # `api` est necessaire meme si aucun test d'integrite ne l'utilise :
        # pytest importe tous les modules de test avant d'appliquer le filtre
        # de marqueurs, et un import manquant interrompt la collecte.
        run: uv sync --group dev --group api

      - name: Verifier l'absence de fuite entre les jeux
        # Garde-fou du cahier des charges : ne jamais melanger entrainement
        # et evaluation, et empreintes d'audit toujours valides. Les controles
        # sont ignores tant que l'artefact concerne n'est pas produit.
        run: uv run pytest -q -m "integrite"
