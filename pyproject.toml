[project]
name = "triage-medical"
version = "0.1.0"
description = "POC d'agent d'aide au triage médical aux urgences"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.2",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # Modeles spaCy epingles : necessaires a Presidio, installes depuis les
    # releases officielles pour que la CI soit reproductible.
    "fr-core-news-md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "pytest>=8.3",
    # Exploration : le notebook importe src/, il ne duplique aucune logique.
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
]
# Entrainement : isole du groupe par defaut pour que l'installation des
# donnees et de la CI reste legere (torch pese a lui seul ~2,5 Go).
train = [
    "torch>=2.5",
    "transformers>=4.51",
    "trl>=0.14",
    "peft>=0.14",
    "accelerate>=1.3",
    "mlflow>=2.20",
]
# Service d'inference : leger, installable en CI pour tester l'API sans GPU.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Autorise les URL directes des modeles spaCy (releases officielles epinglees).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# L'apostrophe typographique francaise est volontaire dans les expressions
# regulieres : les corpus l'utilisent aussi bien que l'apostrophe droite.
"src/triage/data/anonymize.py" = ["RUF001"]
"src/triage/data/lexique_medical.py" = ["RUF001"]
# La variable d'environnement CUDA doit etre posee avant les imports de torch.
"src/triage/training/dpo.py" = ["E402"]
"scripts/*" = ["T20"]  # un script de demonstration affiche, par definition
"notebooks/*" = ["T20"]  # dans un notebook, l'affichage *est* la sortie

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integrite: contrôles portant sur les artefacts de données réels",
]
